<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gruppi: Primo accesso senza account (mockup)</title>
<!-- Mockup approvato della funzione Gruppi. Riferimento visivo per l'implementazione:
     4 temi × versione chiara e scura, scegli dal selettore in basso a destra o con #tema=opaco&modo=notte.
     I font qui arrivano da Google Fonts solo per comodità: nell'app si usano i pacchetti @fontsource locali. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,300..800&amp;family=Figtree:wght@300..800&amp;family=Caveat:wght@400..700&amp;family=JetBrains+Mono:wght@300..700&amp;family=Doto:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
<style>
#mockup-bar{position:fixed;right:12px;bottom:12px;z-index:9999;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:#111;color:#eee;font:13px/1.2 system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#mockup-bar select{font:inherit;padding:3px 6px;border-radius:6px}
#mockup-bar span{opacity:.75}
</style>
</head>
<body>
<div id="mockup-root"></div>
<div id="mockup-bar" role="group" aria-label="Versione del mockup">
  <span>Mockup approvato</span>
  <label>Tema <select name="tema"><option value="notte">Notte</option><option value="opaco">Opaco</option><option value="quaderno">Quaderno</option><option value="fosforo">Fosforo</option></select></label>
  <label>Versione <select name="modo"><option value="giorno">Chiara</option><option value="notte">Scura</option></select></label>
</div>
<template id="mockup-markup">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: {{t.mainBg}}; color: {{t.text}}; font-family: {{t.font}}; font-size: {{t.size}}; line-height: 1.5;">

  <aside style="flex: 1 1 216px; max-width: 216px; min-width: 200px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px; padding: 26px 14px; background: {{t.sideBg}}; border-right: {{t.sideBorder}};">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 15px; font-weight: 600;">
      <sc-if value="{{logoMoon}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.logo}}" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
      <sc-if value="{{logoBook}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.logo}}" stroke-width="1.6" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M4 9h16M4 15h16M10 3v18"></path></svg></sc-if>
      <sc-if value="{{logoDot}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{t.logo}};"></span></sc-if>
      <span>Personal Dashboard</span>
    </div>
    <nav aria-label="Navigazione principale" style="display: flex; flex-direction: column; gap: 2px;">
      <button type="button" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 0; border-radius: {{t.rItem}}; background: transparent; color: {{t.navIdle}}; text-align: left; cursor: pointer;"><span style="display: {{navDot}}; width: 6px; height: 6px; visibility: hidden;"></span>Dashboard</button>
      <button type="button" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 0; border-radius: {{t.rItem}}; background: {{t.navBg}}; color: {{t.navFg}}; font-weight: 500; text-align: left; cursor: pointer;"><span style="display: {{navDot}}; width: 6px; height: 6px; border-radius: 50%; background: {{t.accent}};"></span>Stanza comune</button>
    </nav>
    <div style="margin-top: auto;">
      <button type="button" style="width: 100%; display: flex; align-items: center; height: 40px; padding: 0 12px; border: 0; border-radius: {{t.rItem}}; background: transparent; color: {{t.navIdle}}; cursor: pointer;">Impostazioni</button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 26px 32px 28px; display: flex; align-items: center; justify-content: center;">
    <section aria-labelledby="t" style="width: 100%; max-width: 520px; box-sizing: border-box; padding: 36px; border-radius: {{t.rCard}}; background: {{t.cardBg}}; border: {{t.cardBorder}}; box-shadow: {{t.cardShadow}}; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center;">
      <div style="width: 100%; height: 140px; display: flex; align-items: center; justify-content: center; gap: 18px; border-radius: {{t.rPanel}}; background: {{t.displayBg}}; border: {{t.panelBorder}};" aria-hidden="true">
        <svg width="84" height="56" viewBox="0 0 60 40"><path d="M16 20h8M36 20h8M27 29h6" stroke="{{t.faceOff}}" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>
        <svg width="108" height="72" viewBox="0 0 60 40"><ellipse cx="30" cy="20" rx="27" ry="18" fill="{{t.halo}}"></ellipse><rect x="17" y="13" width="7" height="10" rx="3.5" fill="{{t.face}}"></rect><rect x="36" y="13" width="7" height="10" rx="3.5" fill="{{t.face}}"></rect><path d="M25 27q5 5 10 0" stroke="{{t.face}}" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>
        <svg width="84" height="56" viewBox="0 0 60 40"><path d="M16 20h8M36 20h8M27 29h6" stroke="{{t.faceOff}}" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 id="t" style="margin: 0; font-size: 26px; font-weight: {{t.headW}}; letter-spacing: -0.02em;">Studia insieme ai tuoi amici</h1>
        <p style="margin: 0; color: {{t.text2}};">Crea un gruppo o entra con un codice, e guarda chi sta studiando in questo momento. Senza account l'app funziona come sempre: i tuoi dati restano su questo computer.</p>
      </div>
      <button type="button" style="height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 22px; border: 0; border-radius: {{t.rItem}}; background: {{t.accent}}; color: {{t.onAccent}}; font-weight: 600; font-size: 15px; cursor: pointer;">
        Accedi con Google
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"></path></svg>
      </button>
      <span style="font-size: 12px; color: {{t.muted}}; margin-top: -12px;">L'accesso si apre nel browser, poi torni qui.</span>
      <div style="width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: {{t.rPanel}}; background: {{t.panelBg}}; border: {{t.panelBorder}}; display: flex; flex-direction: column; gap: 8px; text-align: left; font-size: 13px; color: {{t.text2}};">
        <span style="font-weight: 600; color: {{t.text}};">Cosa viene condiviso</span>
        <span>Il nome utente che scegli, se stai studiando o sei in pausa, e il tempo di oggi e della settimana.</span>
        <span>Le singole sessioni, le note e i video restano solo sul tuo computer. Le materie si condividono solo se lo attivi tu.</span>
      </div>
    </section>
  </main>
</div>
</template>
<script type="text/plain" id="mockup-logic">
class Component extends DCLogic {
  // Token dei temi presi da src/styles/tokens.css (variante nativa) e tokens-varianti.css (l'altra).
  static NATIVE = { notte: 'notte', opaco: 'giorno', quaderno: 'giorno', fosforo: 'notte' };
  static BASE = {
    notte: { font: "'Manrope', system-ui, sans-serif", headW: 300, size: '14px',
      mainBg: '#090C15', sideBg: '#090C15', sideBorder: '1px solid #161D30',
      cardBg: 'linear-gradient(180deg, #151B2E 0%, #10152A 100%)', cardBorder: '1px solid #1F2740', cardShadow: 'inset 0 1px 0 rgba(200,215,255,0.07)', rCard: '22px',
      panelBg: '#0B0F1C', panelBorder: '1px solid #182036', displayBg: '#0B0F1C', rPanel: '16px', rItem: '12px',
      text: '#E9ECF5', text2: '#9AA2BA', muted: '#8890A8', accent: '#8EA6FF', onAccent: '#090C15',
      navBg: '#161C2E', navFg: '#E9ECF5', navIdle: '#9AA2BA', logo: '#8EA6FF',
      face: '#DCE3FF', faceOff: '#3A4566', halo: 'rgba(142,166,255,0.16)' },
    opaco: { font: "'Bricolage Grotesque', system-ui, sans-serif", headW: 800, size: '14px',
      mainBg: '#D8D5CD', sideBg: '#D8D5CD', sideBorder: '0',
      cardBg: '#9DB0C0', cardBorder: '0', cardShadow: 'none', rCard: '28px',
      panelBg: '#8EA2B3', panelBorder: '0', displayBg: '#8296A8', rPanel: '18px', rItem: '999px',
      text: '#1B2A36', text2: '#1B2A36', muted: '#1B2A36', accent: '#1B2A36', onAccent: '#ECE9E2',
      navBg: '#22251F', navFg: '#ECE9E2', navIdle: '#4D5047', logo: '#22251F',
      face: '#1B2A36', faceOff: '#4E6273', halo: '#9DB0C0' },
    quaderno: { font: "'Figtree', system-ui, sans-serif", headW: 600, size: '14px',
      mainBg: 'linear-gradient(#E4EBF5 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, #E4EBF5 1px, transparent 1px) 0 0 / 24px 24px, #FCFDFF', sideBg: '#FFFFFF', sideBorder: '1px solid #D6DEEA',
      cardBg: '#FFFFFF', cardBorder: '1px solid #C9D3E3', cardShadow: '0 3px 0 #DCE4F0', rCard: '8px',
      panelBg: '#FFFFFF', panelBorder: '1px solid #DCE6F5', displayBg: '#E9EEF8', rPanel: '6px', rItem: '8px',
      text: '#1B2433', text2: '#556178', muted: '#556178', accent: '#2340A0', onAccent: '#FFFFFF',
      navBg: '#EEF2FB', navFg: '#2340A0', navIdle: '#556178', logo: '#2340A0',
      face: '#1B2433', faceOff: '#B8C4D8', halo: '#FFF1A8' },
    fosforo: { font: "'JetBrains Mono', ui-monospace, monospace", headW: 400, size: '13px',
      mainBg: 'radial-gradient(circle at 96% 104%, #4A131B 0%, #2A0A10 14%, #170609 24%, transparent 25%), #110709', sideBg: 'transparent', sideBorder: '0',
      cardBg: 'rgba(26,13,15,0.9)', cardBorder: '1px solid rgba(255,214,206,0.12)', cardShadow: 'none', rCard: '14px',
      panelBg: 'transparent', panelBorder: '1px solid rgba(255,214,206,0.12)', displayBg: 'radial-gradient(rgba(255,230,220,0.07) 1px, transparent 1.3px) 0 0 / 7px 7px, #0B0405', rPanel: '8px', rItem: '999px',
      text: '#F2E6E1', text2: '#B39C97', muted: '#B39C97', accent: '#F4E9E4', onAccent: '#110709',
      navBg: '#F4E9E4', navFg: '#110709', navIdle: '#B39C97', logo: '#FF4A3D',
      face: '#F4E9E4', faceOff: '#3A2326', halo: 'rgba(255,74,61,0.18)' }
  };
  static OTHER = {
    notte: { mainBg: '#EEF1F7', sideBg: '#EEF1F7', sideBorder: '1px solid #DCE2EE',
      cardBg: 'linear-gradient(180deg, #FFFFFF 0%, #F8FAFD 100%)', cardBorder: '1px solid #DCE2EE', cardShadow: 'none',
      panelBg: '#F4F6FB', panelBorder: '1px solid #E1E6F0', displayBg: '#F4F6FB',
      text: '#141A2E', text2: '#5B6480', muted: '#646C89', accent: '#3B57D6', onAccent: '#FFFFFF',
      navBg: '#E4E9F6', navFg: '#141A2E', navIdle: '#5B6480', logo: '#3B57D6',
      face: '#22305E', faceOff: '#C3CBDC', halo: 'rgba(59,87,214,0.12)' },
    opaco: { mainBg: '#1B1C18', sideBg: '#1B1C18', cardBg: '#34475A', panelBg: '#40546A', displayBg: '#2B3C4D',
      text: '#E1EAF2', text2: '#E1EAF2', muted: '#E1EAF2', accent: '#E1EAF2', onAccent: '#1B2A36',
      navBg: '#ECE9E2', navFg: '#1E1F1B', navIdle: '#A9A79E', logo: '#ECE9E2',
      face: '#E1EAF2', faceOff: '#4A5F73', halo: '#34475A' },
    quaderno: { mainBg: 'linear-gradient(#1C2330 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, #1C2330 1px, transparent 1px) 0 0 / 24px 24px, #121620', sideBg: '#121620', sideBorder: '1px solid #262D3B',
      cardBg: '#1A1F2B', cardBorder: '1px solid #2C3446', cardShadow: '0 3px 0 #0C0F16', panelBg: '#1A1F2B', panelBorder: '1px solid #262E3D', displayBg: '#222A3A',
      text: '#E6EAF2', text2: '#98A3B8', muted: '#98A3B8', accent: '#9FB6FF', onAccent: '#121620',
      navBg: '#222A3B', navFg: '#9FB6FF', navIdle: '#98A3B8', logo: '#9FB6FF',
      face: '#E6EAF2', faceOff: '#3A4459', halo: 'rgba(227,213,140,0.22)' },
    fosforo: { mainBg: 'radial-gradient(circle at 96% 104%, #E6C3C1 0%, #EDD5D2 14%, #F0E3DF 24%, transparent 25%), #EFE9E5',
      cardBg: 'rgba(253,250,248,0.92)', cardBorder: '1px solid rgba(70,24,28,0.12)', panelBorder: '1px solid rgba(70,24,28,0.12)', displayBg: 'radial-gradient(rgba(70,24,28,0.07) 1px, transparent 1.3px) 0 0 / 7px 7px, #E5DDD7',
      text: '#2A1517', text2: '#77605D', muted: '#77605D', accent: '#2A1215', onAccent: '#EFE9E5',
      navBg: '#2A1215', navFg: '#EFE9E5', navIdle: '#77605D', logo: '#E0352B',
      face: '#2A1215', faceOff: '#D6C9C4', halo: 'rgba(224,53,43,0.14)' }
  };

  renderVals() {
    const tema = Component.BASE[this.props.tema] ? this.props.tema : 'notte';
    const modo = this.props.modo === 'giorno' || this.props.modo === 'notte' ? this.props.modo : Component.NATIVE[tema];
    return {
      t: Object.assign({}, Component.BASE[tema], modo === Component.NATIVE[tema] ? {} : Component.OTHER[tema]),
      logoMoon: tema === 'notte', logoBook: tema === 'quaderno', logoDot: tema === 'fosforo',
      navDot: tema === 'notte' ? 'block' : 'none'
    };
  }
}
</script>
<script>
/* Mini-motore per vedere i mockup fuori dall'editor: legge il markup del mockup
   (segnaposto {{...}}, <sc-for>, <sc-if>, onClick/onChange) e lo ridisegna a ogni setState.
   Serve solo come riferimento visivo: NON è codice da riusare nell'app. */
(function () {
  const tpl = document.getElementById('mockup-markup');
  const src = document.getElementById('mockup-logic').textContent;
  const root = document.getElementById('mockup-root');

  class DCLogic {
    constructor(props) { this.props = props || {}; }
    setState(patch) { this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state) : patch); schedule(); }
    forceUpdate() { schedule(); }
  }
  const Component = new Function('DCLogic', src + '\n;return Component;')(DCLogic);

  const params = new URLSearchParams(location.hash.slice(1));
  const props = { tema: params.get('tema') || 'notte', modo: params.get('modo') || '' };
  const NATIVE = { notte: 'notte', opaco: 'giorno', quaderno: 'giorno', fosforo: 'notte' };
  if (!props.modo) props.modo = NATIVE[props.tema] || 'notte';

  let inst = new Component(props);
  inst.state = inst.state || {};
  if (inst.componentDidMount) inst.componentDidMount();

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    let o = scope;
    for (const k of path.split('.')) { if (o == null) return undefined; o = o[k]; }
    return o;
  }
  const WHOLE = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/;
  const ANY = /\{\{\s*([\w.$]+)\s*\}\}/g;
  const interp = (s, scope) => s.replace(ANY, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });

  function process(node, scope) {
    if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const list = lookup((node.getAttribute('list').match(WHOLE) || [])[1] || '', scope) || [];
      const as = node.getAttribute('as') || 'item';
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        for (const child of Array.from(node.childNodes)) {
          const c = child.cloneNode(true);
          const s = Object.assign({}, scope, { [as]: item, $index: i });
          const holder = document.createElement('div'); holder.appendChild(c);
          process(c, s);
          while (holder.firstChild) frag.appendChild(holder.firstChild);
        }
      });
      node.replaceWith(frag);
      return;
    }
    if (tag === 'sc-if') {
      const v = lookup((node.getAttribute('value').match(WHOLE) || [])[1] || '', scope);
      if (!v) { node.remove(); return; }
      const kids = Array.from(node.childNodes);
      kids.forEach((k) => process(k, scope));
      node.replaceWith(...Array.from(node.childNodes));
      return;
    }
    for (const attr of Array.from(node.attributes)) {
      const name = attr.name, val = attr.value;
      if (name.startsWith('hint-')) { node.removeAttribute(name); continue; }
      if (name.startsWith('on')) {
        node.removeAttribute(name);
        const m = val.match(WHOLE); const fn = m && lookup(m[1], scope);
        const ev = name.slice(2).toLowerCase() === 'change' ? 'change' : name.slice(2).toLowerCase();
        if (typeof fn === 'function') node.addEventListener(ev, fn);
        continue;
      }
      if (!val.includes('{{')) continue;
      const m = val.match(WHOLE);
      if (m) {
        const v = lookup(m[1], scope);
        if (typeof v === 'boolean' && !name.startsWith('aria-')) {
          if (v) node.setAttribute(name, ''); else node.removeAttribute(name);
          if (name === 'checked' || name === 'disabled') node[name] = v;
        } else node.setAttribute(name, v == null ? '' : String(v));
      } else node.setAttribute(name, interp(val, scope));
    }
    for (const child of Array.from(node.childNodes)) process(child, scope);
  }

  let pending = false;
  function schedule() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }
  function render() {
    const vals = inst.renderVals();
    const frag = tpl.content.cloneNode(true);
    const holder = document.createElement('div');
    holder.appendChild(frag);
    for (const c of Array.from(holder.childNodes)) process(c, vals);
    root.replaceChildren(...Array.from(holder.childNodes));
  }
  render();

  // Selettore tema / chiaro-scuro.
  const bar = document.getElementById('mockup-bar');
  const selT = bar.querySelector('[name=tema]'), selM = bar.querySelector('[name=modo]');
  selT.value = props.tema; selM.value = props.modo;
  function change() {
    location.hash = 'tema=' + selT.value + '&modo=' + selM.value;
    if (inst.componentWillUnmount) inst.componentWillUnmount();
    inst = new Component({ tema: selT.value, modo: selM.value });
    inst.state = inst.state || {};
    if (inst.componentDidMount) inst.componentDidMount();
    render();
  }
  selT.addEventListener('change', change);
  selM.addEventListener('change', change);
})();

</script>
</body>
</html>
