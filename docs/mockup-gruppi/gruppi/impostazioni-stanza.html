<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gruppi: Impostazioni della stanza (mockup)</title>
<!-- Mockup approvato della funzione Gruppi. Riferimento visivo per l'implementazione:
     4 temi × versione chiara e scura, scegli dal selettore in basso a destra o con #tema=opaco&modo=notte.
     I font qui arrivano da Google Fonts solo per comodità: nell'app si usano i pacchetti @fontsource locali. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,300..800&amp;family=Figtree:wght@300..800&amp;family=Caveat:wght@400..700&amp;family=JetBrains+Mono:wght@300..700&amp;family=Doto:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font:inherit}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
<style>
#mockup-bar{position:fixed;right:12px;bottom:12px;z-index:9999;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:#111;color:#eee;font:13px/1.2 system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#mockup-bar select{font:inherit;padding:3px 6px;border-radius:6px}
#mockup-bar span{opacity:.75}
</style>
</head>
<body>
<div id="mockup-root"></div>
<div id="mockup-bar" role="group" aria-label="Versione del mockup">
  <span>Mockup approvato</span>
  <label>Tema <select name="tema"><option value="notte">Notte</option><option value="opaco">Opaco</option><option value="quaderno">Quaderno</option><option value="fosforo">Fosforo</option></select></label>
  <label>Versione <select name="modo"><option value="giorno">Chiara</option><option value="notte">Scura</option></select></label>
</div>
<template id="mockup-markup">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: {{t.mainBg}}; color: {{t.text}}; font-family: {{t.font}}; font-size: {{t.size}}; line-height: 1.5;">

  <aside style="flex: 1 1 216px; max-width: 216px; min-width: 200px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px; padding: 26px 14px; background: {{t.sideBg}}; border-right: {{t.sideBorder}};">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 15px; font-weight: 600;">
      <sc-if value="{{logoMoon}}" hint-placeholder-val="{{true}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.logo}}" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
      <sc-if value="{{logoBook}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.logo}}" stroke-width="1.6" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M4 9h16M4 15h16M10 3v18"></path></svg></sc-if>
      <sc-if value="{{logoDot}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{t.logo}};"></span></sc-if>
      <span>Personal Dashboard</span>
    </div>
    <nav aria-label="Navigazione principale" style="display: flex; flex-direction: column; gap: 2px;">
      <button type="button" aria-current="page" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 0; border-radius: {{t.rItem}}; background: {{t.navBg}}; color: {{t.navFg}}; font-weight: 500; text-align: left; cursor: pointer;"><span style="display: {{navDot}}; width: 6px; height: 6px; border-radius: 50%; background: {{t.accent}};"></span>Dashboard</button>
      <button type="button" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 0; border-radius: {{t.rItem}}; background: transparent; color: {{t.navIdle}}; text-align: left; cursor: pointer;"><span style="display: {{navDot}}; width: 6px; height: 6px; visibility: hidden;"></span><span style="flex-grow: 1;">Stanza comune</span><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: {{t.accentSoft}}; color: {{t.accentStrong}}; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">7</span></button>
    </nav>
    <div style="margin-top: auto;">
      <button type="button" style="width: 100%; display: flex; align-items: center; height: 40px; padding: 0 12px; border: 0; border-radius: {{t.rItem}}; background: transparent; color: {{t.navIdle}}; cursor: pointer;">Impostazioni</button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 26px 32px 28px; display: flex; flex-direction: column; gap: 20px;">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px;">
      <button type="button" style="height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 8px; border: {{t.ghostBorder}}; border-radius: {{t.rItem}}; background: {{t.ghostBg}}; color: {{t.ghostFg}}; cursor: pointer;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Dashboard</button>
      <div style="display: flex; flex-direction: column;">
        <h1 style="margin: 0; font-size: 28px; font-weight: {{t.headW}}; letter-spacing: -0.02em;">Impostazioni della stanza</h1>
        <span style="color: {{t.text2}};">Ingegneria, sei il proprietario</span>
      </div>
    </header>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; align-items: start;">

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <section aria-labelledby="t-gruppo" style="display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: {{t.rCard}}; background: {{t.cardBg}}; border: {{t.cardBorder}}; box-shadow: {{t.cardShadow}};">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <h2 id="t-gruppo" style="margin: 0; font-size: 16px; font-weight: {{t.titleW}};">Gruppo</h2>
            <span style="font-size: 12px; color: {{t.muted}};">13 / 30 membri</span>
          </div>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: {{t.text2}};">Nome
            <input type="text" value="Ingegneria" maxlength="40" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: {{t.rField}}; border: {{t.fieldBorder}}; background: {{t.fieldBg}}; color: {{t.text}}; font-size: 14px;">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: {{t.text2}};">Descrizione
            <textarea rows="2" maxlength="200" style="box-sizing: border-box; padding: 10px 12px; border-radius: {{t.rField}}; border: {{t.fieldBorder}}; background: {{t.fieldBg}}; color: {{t.text}}; font-size: 14px; resize: none;">Si studia insieme fino agli esami di febbraio.</textarea>
          </label>
        </section>

        <section aria-labelledby="t-codice" style="display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: {{t.rCard}}; background: {{t.cardBg}}; border: {{t.cardBorder}}; box-shadow: {{t.cardShadow}};">
          <h2 id="t-codice" style="margin: 0; font-size: 16px; font-weight: {{t.titleW}};">Codice invito</h2>
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-radius: {{t.rPanel}}; background: {{t.panelBg}}; border: {{t.panelBorder}};">
            <span style="font-family: {{t.disp}}; font-size: 30px; font-weight: {{t.dispW}}; letter-spacing: 0.12em; font-variant-numeric: tabular-nums;">K7QM-3XRP</span>
            <button type="button" onClick="{{copy}}" style="height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border: 0; border-radius: {{t.rItem}}; background: {{t.accent}}; color: {{t.onAccent}}; font-weight: 600; cursor: pointer;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h8"></path></svg>{{copyLabel}}</button>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;">
            <span style="font-size: 12px; color: {{t.muted}}; max-width: 300px;">Chi ha il codice può entrare. Rigeneralo se è finito nelle mani sbagliate: il vecchio smette subito di funzionare.</span>
            <button type="button" style="height: 36px; padding: 0 12px; border: {{t.ghostBorder}}; border-radius: {{t.rItem}}; background: {{t.ghostBg}}; color: {{t.ghostFg}}; cursor: pointer;">Rigenera</button>
          </div>
        </section>

        <section aria-labelledby="t-privacy" style="display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: {{t.rCard}}; background: {{t.cardBg}}; border: {{t.cardBorder}}; box-shadow: {{t.cardShadow}};">
          <h2 id="t-privacy" style="margin: 0; font-size: 16px; font-weight: {{t.titleW}};">Cosa vedono gli altri</h2>
          <label style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer;">
            <span style="display: flex; flex-direction: column;">
              <span>Mostra la materia che sto studiando</span>
              <span style="font-size: 12px; color: {{t.muted}};">Vale per tutti i tuoi gruppi</span>
            </span>
            <input type="checkbox" checked="{{showSubject}}" onChange="{{toggle}}" style="position: absolute; opacity: 0; width: 1px; height: 1px;">
            <span aria-hidden="true" style="flex: 0 0 auto; width: 42px; height: 24px; box-sizing: border-box; padding: 3px; border-radius: 12px; background: {{switchBg}}; display: flex; justify-content: {{switchJustify}};"><span style="width: 18px; height: 18px; border-radius: 50%; background: {{knobBg}};"></span></span>
          </label>
          <div style="padding: 12px 14px; border-radius: {{t.rPanel}}; background: {{t.panelBg}}; border: {{t.panelBorder}}; font-size: 13px; color: {{t.text2}};">
            Gli altri membri vedono solo il tuo <strong style="color: {{t.text}}; font-weight: 600;">nome utente</strong>, se stai studiando o sei in pausa, e il tempo di <strong style="color: {{t.text}}; font-weight: 600;">oggi</strong> e della <strong style="color: {{t.text}}; font-weight: 600;">settimana</strong>. Email e nome Google non vengono mai mostrati.
          </div>
        </section>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <section aria-labelledby="t-membri" style="display: flex; flex-direction: column; gap: 6px; padding: 22px; border-radius: {{t.rCard}}; background: {{t.cardBg}}; border: {{t.cardBorder}}; box-shadow: {{t.cardShadow}};">
          <h2 id="t-membri" style="margin: 0 0 8px; font-size: 16px; font-weight: {{t.titleW}};">Membri</h2>
          <sc-for list="{{members}}" as="m" hint-placeholder-count="8">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 4px 8px; border-radius: {{t.rRow}}; background: {{m.rowBg}};">
              <span aria-hidden="true" style="width: 32px; height: 32px; flex: 0 0 auto; border-radius: 50%; background: {{t.panelBg}}; border: {{t.ghostBorder}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: {{t.accentStrong}};">{{m.initial}}</span>
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
                <span style="font-weight: 500;">{{m.name}}</span>
                <span style="font-size: 12px; color: {{t.muted}};">{{m.since}}</span>
              </span>
              <sc-if value="{{m.isOwner}}" hint-placeholder-val="{{false}}">
                <span style="padding: 2px 10px; border-radius: {{t.rItem}}; background: {{t.accentSoft}}; color: {{t.accentStrong}}; font-size: 12px;">Proprietario</span>
              </sc-if>
              <sc-if value="{{m.canRemove}}" hint-placeholder-val="{{true}}">
                <button type="button" aria-label="{{m.removeLabel}}" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: {{t.rItem}}; background: transparent; color: {{t.muted}}; cursor: pointer;">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                </button>
              </sc-if>
            </div>
          </sc-for>
        </section>

        <section aria-labelledby="t-esci" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 22px; border-radius: {{t.rCard}}; background: {{t.dangerCard}}; border: {{t.dangerBorder}};">
          <div style="display: flex; flex-direction: column; gap: 2px; max-width: 320px;">
            <h2 id="t-esci" style="margin: 0; font-size: 16px; font-weight: {{t.titleW}};">Abbandona il gruppo</h2>
            <span style="font-size: 12px; color: {{t.text2}};">Sei il proprietario: il gruppo passerà a <strong style="color: {{t.text}}; font-weight: 600;">giulia.r</strong>, il membro più anziano. Il tuo studio resta sul tuo computer.</span>
          </div>
          <button type="button" style="height: 40px; padding: 0 16px; border: {{t.dangerBorder}}; border-radius: {{t.rItem}}; background: {{t.dangerSoft}}; color: {{t.danger}}; font-weight: 600; cursor: pointer;">Abbandona</button>
        </section>
      </div>
    </div>
  </main>
</div>
</template>

      text: '#2A1517', text2: '#77605D', muted: '#77605D',
      accent: '#2A1215', accentStrong: '#2A1215', accentSoft: 'rgba(70,24,28,0.07)', onAccent: '#EFE9E5',
      navBg: '#2A1215', navFg: '#EFE9E5', navIdle: '#77605D', ghostBorder: '1px solid rgba(70,24,28,0.16)', ghostFg: '#77605D',
      danger: '#E0352B', dangerSoft: 'rgba(224,53,43,0.10)', dangerBorder: '1px solid rgba(224,53,43,0.4)',
      track: '#D6C9C4', knobOff: '#77605D', rowActive: 'rgba(70,24,28,0.05)', fieldBg: '#FDFAF8', fieldBorder: '1px solid rgba(70,24,28,0.16)', logo: '#E0352B' }
  };

  state = { showSubject: false, copied: false };

  renderVals() {
    const tema = Component.BASE[this.props.tema] ? this.props.tema : 'notte';
    const modo = this.props.modo === 'giorno' || this.props.modo === 'notte' ? this.props.modo : Component.NATIVE[tema];
    const t = Object.assign({}, Component.BASE[tema], modo === Component.NATIVE[tema] ? {} : Component.OTHER[tema]);

    const people = [
      ['matteo_s', 'tu, dal 2 ottobre', true],
      ['giulia.r', 'dal 2 ottobre', false],
      ['chiara_b', 'dal 4 ottobre', false],
      ['luca04', 'dal 9 ottobre', false],
      ['sara.m', 'dal 11 ottobre', false],
      ['marco_t', 'dal 15 ottobre', false],
      ['davide', 'dal 20 ottobre', false],
      ['elena.v', 'da ieri', false]
    ];
    const on = this.state.showSubject;
    return {
      t,
      logoMoon: tema === 'notte', logoBook: tema === 'quaderno', logoDot: tema === 'fosforo',
      navDot: tema === 'notte' ? 'block' : 'none',
      showSubject: on,
      toggle: () => this.setState({ showSubject: !on }),
      switchBg: on ? t.accent : t.track,
      switchJustify: on ? 'flex-end' : 'flex-start',
      knobBg: on ? t.onAccent : t.knobOff,
      copyLabel: this.state.copied ? 'Copiato' : 'Copia',
      copy: () => this.setState({ copied: true }),
      members: people.map(([name, since, owner]) => ({
        name, since, initial: name.charAt(0).toUpperCase(),
        isOwner: owner, canRemove: !owner,
        removeLabel: 'Rimuovi ' + name,
        rowBg: owner ? t.rowActive : 'transparent'
      }))
    };
  }
}
</script>
<script>
/* Mini-motore per vedere i mockup fuori dall'editor: legge il markup del mockup
   (segnaposto {{...}}, <sc-for>, <sc-if>, onClick/onChange) e lo ridisegna a ogni setState.
   Serve solo come riferimento visivo: NON è codice da riusare nell'app. */
(function () {
  const tpl = document.getElementById('mockup-markup');
  const src = document.getElementById('mockup-logic').textContent;
  const root = document.getElementById('mockup-root');

  class DCLogic {
    constructor(props) { this.props = props || {}; }
    setState(patch) { this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state) : patch); schedule(); }
    forceUpdate() { schedule(); }
  }
  const Component = new Function('DCLogic', src + '\n;return Component;')(DCLogic);

  const params = new URLSearchParams(location.hash.slice(1));
  const props = { tema: params.get('tema') || 'notte', modo: params.get('modo') || '' };
  const NATIVE = { notte: 'notte', opaco: 'giorno', quaderno: 'giorno', fosforo: 'notte' };
  if (!props.modo) props.modo = NATIVE[props.tema] || 'notte';

  let inst = new Component(props);
  inst.state = inst.state || {};
  if (inst.componentDidMount) inst.componentDidMount();

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    let o = scope;
    for (const k of path.split('.')) { if (o == null) return undefined; o = o[k]; }
    return o;
  }
  const WHOLE = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/;
  const ANY = /\{\{\s*([\w.$]+)\s*\}\}/g;
  const interp = (s, scope) => s.replace(ANY, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });

  function process(node, scope) {
    if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const list = lookup((node.getAttribute('list').match(WHOLE) || [])[1] || '', scope) || [];
      const as = node.getAttribute('as') || 'item';
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        for (const child of Array.from(node.childNodes)) {
          const c = child.cloneNode(true);
          const s = Object.assign({}, scope, { [as]: item, $index: i });
          const holder = document.createElement('div'); holder.appendChild(c);
          process(c, s);
          while (holder.firstChild) frag.appendChild(holder.firstChild);
        }
      });
      node.replaceWith(frag);
      return;
    }
    if (tag === 'sc-if') {
      const v = lookup((node.getAttribute('value').match(WHOLE) || [])[1] || '', scope);
      if (!v) { node.remove(); return; }
      const kids = Array.from(node.childNodes);
      kids.forEach((k) => process(k, scope));
      node.replaceWith(...Array.from(node.childNodes));
      return;
    }
    for (const attr of Array.from(node.attributes)) {
      const name = attr.name, val = attr.value;
      if (name.startsWith('hint-')) { node.removeAttribute(name); continue; }
      if (name.startsWith('on')) {
        node.removeAttribute(name);
        const m = val.match(WHOLE); const fn = m && lookup(m[1], scope);
        const ev = name.slice(2).toLowerCase() === 'change' ? 'change' : name.slice(2).toLowerCase();
        if (typeof fn === 'function') node.addEventListener(ev, fn);
        continue;
      }
      if (!val.includes('{{')) continue;
      const m = val.match(WHOLE);
      if (m) {
        const v = lookup(m[1], scope);
        if (typeof v === 'boolean' && !name.startsWith('aria-')) {
          if (v) node.setAttribute(name, ''); else node.removeAttribute(name);
          if (name === 'checked' || name === 'disabled') node[name] = v;
        } else node.setAttribute(name, v == null ? '' : String(v));
      } else node.setAttribute(name, interp(val, scope));
    }
    for (const child of Array.from(node.childNodes)) process(child, scope);
  }

  let pending = false;
  function schedule() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }
  function render() {
    const vals = inst.renderVals();
    const frag = tpl.content.cloneNode(true);
    const holder = document.createElement('div');
    holder.appendChild(frag);
    for (const c of Array.from(holder.childNodes)) process(c, vals);
    root.replaceChildren(...Array.from(holder.childNodes));
  }
  render();

  // Selettore tema / chiaro-scuro.
  const bar = document.getElementById('mockup-bar');
  const selT = bar.querySelector('[name=tema]'), selM = bar.querySelector('[name=modo]');
  selT.value = props.tema; selM.value = props.modo;
  function change() {
    location.hash = 'tema=' + selT.value + '&modo=' + selM.value;
    if (inst.componentWillUnmount) inst.componentWillUnmount();
    inst = new Component({ tema: selT.value, modo: selM.value });
    inst.state = inst.state || {};
    if (inst.componentDidMount) inst.componentDidMount();
    render();
  }
  selT.addEventListener('change', change);
  selM.addEventListener('change', change);
})();

</script>
</body>
