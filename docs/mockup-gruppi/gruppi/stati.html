<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gruppi: Stati: accesso in corso, nessun gruppo, offline (mockup)</title>
<!-- Mockup approvato della funzione Gruppi. Riferimento visivo per l'implementazione:
     4 temi × versione chiara e scura, scegli dal selettore in basso a destra o con #tema=opaco&modo=notte.
     I font qui arrivano da Google Fonts solo per comodità: nell'app si usano i pacchetti @fontsource locali. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,300..800&amp;family=Figtree:wght@300..800&amp;family=Caveat:wght@400..700&amp;family=JetBrains+Mono:wght@300..700&amp;family=Doto:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit}
</style>
<style>
#mockup-bar{position:fixed;right:12px;bottom:12px;z-index:9999;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:#111;color:#eee;font:13px/1.2 system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#mockup-bar select{font:inherit;padding:3px 6px;border-radius:6px}
#mockup-bar span{opacity:.75}
</style>
</head>
<body>
<div id="mockup-root"></div>
<div id="mockup-bar" role="group" aria-label="Versione del mockup">
  <span>Mockup approvato</span>
  <label>Tema <select name="tema"><option value="notte">Notte</option><option value="opaco">Opaco</option><option value="quaderno">Quaderno</option><option value="fosforo">Fosforo</option></select></label>
  <label>Versione <select name="modo"><option value="giorno">Chiara</option><option value="notte">Scura</option></select></label>
</div>
<template id="mockup-markup">
<div style="width: 1280px; height: 520px; box-sizing: border-box; padding: 48px 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; background: {{t.mainBg}}; color: {{t.text}}; font-family: {{t.font}}; font-size: {{t.size}}; line-height: 1.5;">

  <section aria-labelledby="s1" style="box-sizing: border-box; padding: 28px; border-radius: {{t.rCard}}; background: {{t.cardBg}}; border: {{t.cardBorder}}; box-shadow: {{t.cardShadow}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;">
    <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="24" fill="none" stroke="{{t.track}}" stroke-width="3"></circle><path d="M28 4a24 24 0 0 1 24 24" fill="none" stroke="{{t.accent}}" stroke-width="3" stroke-linecap="round"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h2 id="s1" style="margin: 0; font-size: 18px; font-weight: {{t.titleW}};">Completa l'accesso nel browser</h2>
      <p style="margin: 0; color: {{t.text2}};">Si è aperta una pagina di Google. Quando hai finito, l'app si aggiorna da sola.</p>
    </div>
    <div style="display: flex; gap: 8px;">
      <button type="button" style="height: 40px; padding: 0 14px; border: {{t.ghostBorder}}; border-radius: {{t.rItem}}; background: {{t.ghostBg}}; color: {{t.ghostFg}}; cursor: pointer;">Riapri il browser</button>
      <button type="button" style="height: 40px; padding: 0 14px; border: 0; border-radius: {{t.rItem}}; background: transparent; color: {{t.text2}}; cursor: pointer;">Annulla</button>
    </div>
  </section>

  <section aria-labelledby="s2" style="box-sizing: border-box; padding: 28px; border-radius: {{t.rCard}}; background: {{t.cardBg}}; border: {{t.cardBorder}}; box-shadow: {{t.cardShadow}}; display: flex; flex-direction: column; justify-content: center; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h2 id="s2" style="margin: 0; font-size: 18px; font-weight: {{t.titleW}};">Ciao matteo_s, nessun gruppo ancora</h2>
      <p style="margin: 0; color: {{t.text2}};">Crea una stanza e manda il codice agli amici, oppure entra in quella di qualcun altro.</p>
    </div>
    <button type="button" style="display: flex; align-items: center; gap: 14px; padding: 16px; border: {{t.panelBorder}}; border-radius: {{t.rPanel}}; background: {{t.panelBg}}; color: {{t.text}}; text-align: left; cursor: pointer;">
      <span style="width: 40px; height: 40px; flex: 0 0 auto; border-radius: {{t.rIcon}}; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
      <span style="display: flex; flex-direction: column;"><span style="font-weight: 600;">Crea un gruppo</span><span style="font-size: 12px; color: {{t.muted}};">Ricevi un codice invito</span></span>
    </button>
    <button type="button" style="display: flex; align-items: center; gap: 14px; padding: 16px; border: {{t.panelBorder}}; border-radius: {{t.rPanel}}; background: {{t.panelBg}}; color: {{t.text}}; text-align: left; cursor: pointer;">
      <span style="width: 40px; height: 40px; flex: 0 0 auto; border-radius: {{t.rIcon}}; background: {{t.accentSoft}}; color: {{t.accentStrong}}; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="M10 17l5-5-5-5"></path><path d="M15 12H3"></path></svg></span>
      <span style="display: flex; flex-direction: column;"><span style="font-weight: 600;">Entra con codice</span><span style="font-size: 12px; color: {{t.muted}};">Te lo dà un membro del gruppo</span></span>
    </button>
  </section>

  <section aria-labelledby="s3" style="box-sizing: border-box; padding: 28px; border-radius: {{t.rCard}}; background: {{t.cardBg}}; border: {{t.cardBorder}}; box-shadow: {{t.cardShadow}}; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: {{t.rPanel}}; background: {{t.warnSoft}}; border: {{t.warnBorder}}; color: {{t.warn}}; font-size: 13px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="flex: 0 0 auto; margin-top: 1px;" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.6a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0M3 3l18 18"></path></svg>
      <span><strong id="s3" style="font-weight: 600;">Gruppi non raggiungibili.</strong> Lo studio continua a essere salvato qui e si sincronizza appena torni online.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; opacity: 0.6;">
      <sc-for list="{{stale}}" as="p" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: {{t.rPanel}}; background: {{t.panelBg}}; border: {{t.panelBorder}};"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.off}};" aria-hidden="true"></span><span style="flex-grow: 1;">{{p.name}}</span><span style="color: {{t.muted}}; font-size: 12px;">ultimo dato 10:42</span></div>
      </sc-for>
    </div>
    <button type="button" style="margin-top: auto; align-self: flex-start; height: 40px; padding: 0 14px; border: {{t.ghostBorder}}; border-radius: {{t.rItem}}; background: {{t.ghostBg}}; color: {{t.ghostFg}}; cursor: pointer;">Riprova ora</button>
  </section>
</div>
</template>
<script type="text/plain" id="mockup-logic">
class Component extends DCLogic {
  // Token dei temi presi da src/styles/tokens.css (variante nativa) e tokens-varianti.css (l'altra).
  static NATIVE = { notte: 'notte', opaco: 'giorno', quaderno: 'giorno', fosforo: 'notte' };
  static BASE = {
    notte: { font: "'Manrope', system-ui, sans-serif", titleW: 400, size: '14px',
      mainBg: '#090C15', cardBg: 'linear-gradient(180deg, #151B2E 0%, #10152A 100%)', cardBorder: '1px solid #1F2740', cardShadow: 'inset 0 1px 0 rgba(200,215,255,0.07)', rCard: '22px',
      panelBg: '#0B0F1C', panelBorder: '1px solid #182036', rPanel: '16px', rItem: '12px', rIcon: '12px',
      text: '#E9ECF5', text2: '#9AA2BA', muted: '#8890A8', accent: '#8EA6FF', accentStrong: '#B7C6FF', accentSoft: 'rgba(142,166,255,0.14)', onAccent: '#090C15',
      ghostBorder: '1px solid #2A3350', ghostBg: 'transparent', ghostFg: '#C9CFE0', track: '#1E2538', off: '#3A4566',
      warn: '#F0B47A', warnSoft: 'rgba(240,180,122,0.12)', warnBorder: '1px solid rgba(240,180,122,0.3)' },
    opaco: { font: "'Bricolage Grotesque', system-ui, sans-serif", titleW: 800, size: '14px',
      mainBg: '#D8D5CD', cardBg: '#EFECE5', cardBorder: '0', cardShadow: 'none', rCard: '28px',
      panelBg: '#E2DED5', panelBorder: '0', rPanel: '18px', rItem: '999px', rIcon: '999px',
      text: '#22251F', text2: '#4D5047', muted: '#4D5047', accent: '#22251F', accentStrong: '#22251F', accentSoft: '#C9C5BB', onAccent: '#ECE9E2',
      ghostBorder: '0', ghostBg: '#C9C5BB', ghostFg: '#22251F', track: '#C9C5BB', off: '#A8A49A',
      warn: '#3A2C0A', warnSoft: '#D2B26A', warnBorder: '0' },
    quaderno: { font: "'Figtree', system-ui, sans-serif", titleW: 600, size: '14px',
      mainBg: 'linear-gradient(#E4EBF5 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, #E4EBF5 1px, transparent 1px) 0 0 / 24px 24px, #FCFDFF',
      cardBg: '#FFFFFF', cardBorder: '1px solid #C9D3E3', cardShadow: '0 3px 0 #DCE4F0', rCard: '8px',
      panelBg: '#FFFFFF', panelBorder: '1px solid #DCE6F5', rPanel: '6px', rItem: '8px', rIcon: '6px',
      text: '#1B2433', text2: '#556178', muted: '#556178', accent: '#2340A0', accentStrong: '#2340A0', accentSoft: 'rgba(35,64,160,0.08)', onAccent: '#FFFFFF',
      ghostBorder: '1.5px solid #2340A0', ghostBg: 'transparent', ghostFg: '#2340A0', track: '#B8C4D8', off: '#B8C4D8',
      warn: '#5C3A08', warnSoft: '#FFF1A8', warnBorder: '0' },
    fosforo: { font: "'JetBrains Mono', ui-monospace, monospace", titleW: 400, size: '13px',
      mainBg: 'radial-gradient(circle at 96% 104%, #4A131B 0%, #2A0A10 14%, #170609 24%, transparent 25%), #110709',
      cardBg: 'rgba(26,13,15,0.9)', cardBorder: '1px solid rgba(255,214,206,0.12)', cardShadow: 'none', rCard: '14px',
      panelBg: 'transparent', panelBorder: '1px solid rgba(255,214,206,0.12)', rPanel: '8px', rItem: '999px', rIcon: '999px',
      text: '#F2E6E1', text2: '#B39C97', muted: '#B39C97', accent: '#F4E9E4', accentStrong: '#F4E9E4', accentSoft: 'rgba(255,214,206,0.07)', onAccent: '#110709',
      ghostBorder: '1px solid rgba(255,214,206,0.16)', ghostBg: 'transparent', ghostFg: '#B39C97', track: '#3A2326', off: '#3A2326',
      warn: '#F4E9E4', warnSoft: 'rgba(255,74,61,0.10)', warnBorder: '1px solid rgba(255,74,61,0.4)' }
  };
  static OTHER = {
    notte: { mainBg: '#EEF1F7', cardBg: 'linear-gradient(180deg, #FFFFFF 0%, #F8FAFD 100%)', cardBorder: '1px solid #DCE2EE', cardShadow: 'none',
      panelBg: '#F4F6FB', panelBorder: '1px solid #E1E6F0',
      text: '#141A2E', text2: '#5B6480', muted: '#646C89', accent: '#3B57D6', accentStrong: '#3049B8', accentSoft: 'rgba(59,87,214,0.10)', onAccent: '#FFFFFF',
      ghostBorder: '1px solid #CBD3E4', ghostFg: '#2A3350', track: '#E3E8F1', off: '#C3CBDC',
      warn: '#7A4A10', warnSoft: 'rgba(194,118,40,0.10)', warnBorder: '1px solid rgba(194,118,40,0.3)' },
    opaco: { mainBg: '#1B1C18', cardBg: '#2A2B26', panelBg: '#34352F',
      text: '#ECE9E2', text2: '#A9A79E', muted: '#A9A79E', accent: '#ECE9E2', accentStrong: '#ECE9E2', accentSoft: '#34352F', onAccent: '#1E1F1B',
      ghostBg: '#34352F', ghostFg: '#ECE9E2', track: '#34352F', off: '#4A4B44',
      warn: '#F3E3BA', warnSoft: '#6B5523' },
    quaderno: { mainBg: 'linear-gradient(#1C2330 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(90deg, #1C2330 1px, transparent 1px) 0 0 / 24px 24px, #121620',
      cardBg: '#1A1F2B', cardBorder: '1px solid #2C3446', cardShadow: '0 3px 0 #0C0F16', panelBg: '#1A1F2B', panelBorder: '1px solid #262E3D',
      text: '#E6EAF2', text2: '#98A3B8', muted: '#98A3B8', accent: '#9FB6FF', accentStrong: '#9FB6FF', accentSoft: 'rgba(159,182,255,0.10)', onAccent: '#121620',
      ghostBorder: '1.5px solid #9FB6FF', ghostFg: '#9FB6FF', track: '#3A4459', off: '#3A4459',
      warn: '#1B2433', warnSoft: '#E3D58C' },
    fosforo: { mainBg: 'radial-gradient(circle at 96% 104%, #E6C3C1 0%, #EDD5D2 14%, #F0E3DF 24%, transparent 25%), #EFE9E5',
      cardBg: 'rgba(253,250,248,0.92)', cardBorder: '1px solid rgba(70,24,28,0.12)', panelBorder: '1px solid rgba(70,24,28,0.12)',
      text: '#2A1517', text2: '#77605D', muted: '#77605D', accent: '#2A1215', accentStrong: '#2A1215', accentSoft: 'rgba(70,24,28,0.07)', onAccent: '#EFE9E5',
      ghostBorder: '1px solid rgba(70,24,28,0.16)', ghostFg: '#77605D', track: '#D6C9C4', off: '#D6C9C4',
      warn: '#2A1215', warnSoft: 'rgba(224,53,43,0.08)', warnBorder: '1px solid rgba(224,53,43,0.4)' }
  };

  renderVals() {
    const tema = Component.BASE[this.props.tema] ? this.props.tema : 'notte';
    const modo = this.props.modo === 'giorno' || this.props.modo === 'notte' ? this.props.modo : Component.NATIVE[tema];
    return {
      t: Object.assign({}, Component.BASE[tema], modo === Component.NATIVE[tema] ? {} : Component.OTHER[tema]),
      stale: [{ name: 'giulia.r' }, { name: 'sara.m' }, { name: 'luca04' }]
    };
  }
}
</script>
<script>
/* Mini-motore per vedere i mockup fuori dall'editor: legge il markup del mockup
   (segnaposto {{...}}, <sc-for>, <sc-if>, onClick/onChange) e lo ridisegna a ogni setState.
   Serve solo come riferimento visivo: NON è codice da riusare nell'app. */
(function () {
  const tpl = document.getElementById('mockup-markup');
  const src = document.getElementById('mockup-logic').textContent;
  const root = document.getElementById('mockup-root');

  class DCLogic {
    constructor(props) { this.props = props || {}; }
    setState(patch) { this.state = Object.assign({}, this.state, typeof patch === 'function' ? patch(this.state) : patch); schedule(); }
    forceUpdate() { schedule(); }
  }
  const Component = new Function('DCLogic', src + '\n;return Component;')(DCLogic);

  const params = new URLSearchParams(location.hash.slice(1));
  const props = { tema: params.get('tema') || 'notte', modo: params.get('modo') || '' };
  const NATIVE = { notte: 'notte', opaco: 'giorno', quaderno: 'giorno', fosforo: 'notte' };
  if (!props.modo) props.modo = NATIVE[props.tema] || 'notte';

  let inst = new Component(props);
  inst.state = inst.state || {};
  if (inst.componentDidMount) inst.componentDidMount();

  function lookup(path, scope) {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    let o = scope;
    for (const k of path.split('.')) { if (o == null) return undefined; o = o[k]; }
    return o;
  }
  const WHOLE = /^\s*\{\{\s*([\w.$]+)\s*\}\}\s*$/;
  const ANY = /\{\{\s*([\w.$]+)\s*\}\}/g;
  const interp = (s, scope) => s.replace(ANY, (_, p) => { const v = lookup(p, scope); return v == null ? '' : String(v); });

  function process(node, scope) {
    if (node.nodeType === 3) { if (node.nodeValue.includes('{{')) node.nodeValue = interp(node.nodeValue, scope); return; }
    if (node.nodeType !== 1) return;
    const tag = node.localName;
    if (tag === 'sc-for') {
      const list = lookup((node.getAttribute('list').match(WHOLE) || [])[1] || '', scope) || [];
      const as = node.getAttribute('as') || 'item';
      const frag = document.createDocumentFragment();
      list.forEach((item, i) => {
        for (const child of Array.from(node.childNodes)) {
          const c = child.cloneNode(true);
          const s = Object.assign({}, scope, { [as]: item, $index: i });
          const holder = document.createElement('div'); holder.appendChild(c);
          process(c, s);
          while (holder.firstChild) frag.appendChild(holder.firstChild);
        }
      });
      node.replaceWith(frag);
      return;
    }
    if (tag === 'sc-if') {
      const v = lookup((node.getAttribute('value').match(WHOLE) || [])[1] || '', scope);
      if (!v) { node.remove(); return; }
      const kids = Array.from(node.childNodes);
      kids.forEach((k) => process(k, scope));
      node.replaceWith(...Array.from(node.childNodes));
      return;
    }
    for (const attr of Array.from(node.attributes)) {
      const name = attr.name, val = attr.value;
      if (name.startsWith('hint-')) { node.removeAttribute(name); continue; }
      if (name.startsWith('on')) {
        node.removeAttribute(name);
        const m = val.match(WHOLE); const fn = m && lookup(m[1], scope);
        const ev = name.slice(2).toLowerCase() === 'change' ? 'change' : name.slice(2).toLowerCase();
        if (typeof fn === 'function') node.addEventListener(ev, fn);
        continue;
      }
      if (!val.includes('{{')) continue;
      const m = val.match(WHOLE);
      if (m) {
        const v = lookup(m[1], scope);
        if (typeof v === 'boolean' && !name.startsWith('aria-')) {
          if (v) node.setAttribute(name, ''); else node.removeAttribute(name);
          if (name === 'checked' || name === 'disabled') node[name] = v;
        } else node.setAttribute(name, v == null ? '' : String(v));
      } else node.setAttribute(name, interp(val, scope));
    }
    for (const child of Array.from(node.childNodes)) process(child, scope);
  }

  let pending = false;
  function schedule() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }
  function render() {
    const vals = inst.renderVals();
    const frag = tpl.content.cloneNode(true);
    const holder = document.createElement('div');
    holder.appendChild(frag);
    for (const c of Array.from(holder.childNodes)) process(c, vals);
    root.replaceChildren(...Array.from(holder.childNodes));
  }
  render();

  // Selettore tema / chiaro-scuro.
  const bar = document.getElementById('mockup-bar');
  const selT = bar.querySelector('[name=tema]'), selM = bar.querySelector('[name=modo]');
  selT.value = props.tema; selM.value = props.modo;
  function change() {
    location.hash = 'tema=' + selT.value + '&modo=' + selM.value;
    if (inst.componentWillUnmount) inst.componentWillUnmount();
    inst = new Component({ tema: selT.value, modo: selM.value });
    inst.state = inst.state || {};
    if (inst.componentDidMount) inst.componentDidMount();
    render();
  }
  selT.addEventListener('change', change);
  selM.addEventListener('change', change);
})();

</script>
</body>
