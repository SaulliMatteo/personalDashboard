<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tema Opaco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#D8D5CD}
a{color:#22251F}a:hover{color:#000}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #22251F;outline-offset:2px}
.o-card{box-sizing:border-box;min-width:0;min-height:0;overflow:hidden;border-radius:28px}
@media (max-width:820px){
.o-root{height:auto !important}
.o-grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;grid-template-rows:none !important;grid-auto-rows:auto !important}
.o-grid>*{grid-column:auto / span 2 !important;grid-row:auto !important;min-height:200px}
.o-side{flex:1 1 100% !important}
}
</style>
</head>
<body>
<div class="o-root" style="width: 100%; height: 100vh; min-height: 680px; display: flex; flex-wrap: wrap; background: #D8D5CD; color: #22251F; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<aside class="o-side" style="flex: 0 0 208px; box-sizing: border-box; padding: 28px 16px; display: flex; flex-direction: column; gap: 30px">
<div style="padding: 0 10px; font-weight: 800; font-size: 18px; line-height: 1.1">Personal<br>Dashboard</div>
<nav style="display: flex; flex-direction: column; gap: 4px" aria-label="Navigazione principale">
<button type="button" style="align-self: flex-start; height: 40px; padding: 0 18px; border: 0; border-radius: 20px; background: #22251F; color: #ECE9E2; font-weight: 600">Dashboard</button>
<button type="button" style="align-self: flex-start; height: 40px; padding: 0 18px; border: 0; border-radius: 20px; background: transparent; color: #4D5047; font-weight: 500">Tasks</button>
<button type="button" style="align-self: flex-start; height: 40px; padding: 0 18px; border: 0; border-radius: 20px; background: transparent; color: #4D5047; font-weight: 500">Projects</button>
<button type="button" style="align-self: flex-start; height: 40px; padding: 0 18px; border: 0; border-radius: 20px; background: transparent; color: #4D5047; font-weight: 500">Notes</button>
</nav>
<div style="margin-top: auto"><button type="button" style="height: 40px; padding: 0 18px; border: 0; border-radius: 20px; background: #C9C5BB; color: #22251F; font-weight: 500">Impostazioni</button></div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; height: 100%; box-sizing: border-box; padding: 26px 30px 28px 8px; display: flex; flex-direction: column; gap: 18px">
<header style="flex: 0 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Buonasera, Matteo</h1>
<p style="margin: 0; color: #4D5047; font-size: 15px; font-weight: 500">Martedì 20 ottobre</p>
</header>

<div class="o-grid" style="flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 12px">

<article class="o-card" style="grid-column: 1 / 4; grid-row: 1 / 4; padding: 28px; background: #A9B59C; color: #1F2B1C; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Studio</h2>
<div style="display: flex; gap: 5px" title="Ciclo 3 di 4"><span style="width: 22px; height: 8px; border-radius: 4px; background: #1F2B1C"></span><span style="width: 22px; height: 8px; border-radius: 4px; background: #1F2B1C"></span><span style="width: 22px; height: 8px; border-radius: 4px; background: #5E6E55"></span><span style="width: 22px; height: 8px; border-radius: 4px; background: #8E9C80"></span></div>
</div>
<div style="margin-top: auto">
<div style="font-size: 15px; font-weight: 500">Concentrazione su Analisi 2</div>
<div style="font-size: 150px; font-weight: 800; letter-spacing: -0.06em; line-height: 0.82; margin: 10px 0 18px -6px; font-variant-numeric: tabular-nums">18:42</div>
<div style="height: 16px; border-radius: 8px; background: #8E9C80"><div style="width: 62%; height: 100%; border-radius: 8px; background: #1F2B1C"></div></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 22px; flex-wrap: wrap">
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #1F2B1C; color: #DCE4D3; font-weight: 500">Analisi 2 · 1h 20m</button>
<button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #95A387; color: #1F2B1C; font-weight: 500">Basi di dati · 45m</button>
<button type="button" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #95A387; color: #1F2B1C; font-weight: 500">Fisica</button>
</div>
<div style="display: flex; gap: 8px">
<button type="button" aria-label="Metti in pausa" style="width: 52px; height: 52px; border-radius: 50%; border: 0; background: #1F2B1C; color: #DCE4D3; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg></button>
<button type="button" aria-label="Ferma" style="width: 52px; height: 52px; border-radius: 50%; border: 0; background: #95A387; color: #1F2B1C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3"></rect></svg></button>
</div>
</div>
</article>

<article class="o-card" style="grid-column: 4 / 6; grid-row: 1 / 3; padding: 22px; background: #9DB0C0; color: #1B2A36; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 26px; font-weight: 800">Pixel</h2><span style="font-size: 13px; font-weight: 500">Ti guarda studiare</span></div>
<div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 30px">
<span aria-hidden="true" style="width: 44px; height: 62px; border-radius: 22px; background: #1B2A36"></span><span aria-hidden="true" style="width: 44px; height: 62px; border-radius: 22px; background: #1B2A36"></span>
</div>
<div style="align-self: flex-start; padding: 8px 14px; border-radius: 18px 18px 18px 6px; background: #ECE9E2; font-size: 13px; font-weight: 500">Bel ritmo, continua così</div>
</article>

<article class="o-card" style="grid-column: 6 / 7; grid-row: 1 / 2; padding: 18px; background: #D2B26A; color: #3A2C0A; display: flex; flex-direction: column">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 600">File</span><span style="padding: 2px 8px; border-radius: 10px; background: #3A2C0A; color: #EFDFB8; font-size: 11px; font-weight: 500">Online</span></div>
<div style="margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between">
<div><div style="font-size: 62px; font-weight: 800; line-height: 0.85">3</div><div style="font-size: 12px; font-weight: 500; margin-top: 4px">ricevuti</div></div>
<button type="button" aria-label="Ferma il server" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #3A2C0A; color: #EFDFB8; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3"></rect></svg></button>
</div>
</article>

<button type="button" style="grid-column: 6 / 7; grid-row: 2 / 3; border: 2px dashed #9E9A90; border-radius: 28px; background: transparent; color: #4D5047; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<span style="font-size: 30px; font-weight: 400; line-height: 1" aria-hidden="true">+</span>Aggiungi widget</button>

<article class="o-card" style="grid-column: 4 / 7; grid-row: 3 / 5; padding: 18px; background: #B8A1B4; color: #33213A; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); column-gap: 18px">
<div style="min-width: 0; display: flex; flex-direction: column; gap: 12px">
<button type="button" aria-label="Continua: Normalizzazione e forme normali" style="flex: 0 0 auto; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 20px; background: #8F7690; color: #F1E6EF; display: flex; align-items: center; justify-content: center; padding: 0">
<span style="width: 56px; height: 56px; border-radius: 50%; background: #33213A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg></span>
</button>
<div style="height: 10px; border-radius: 5px; background: #9C849A"><div style="width: 41%; height: 100%; border-radius: 5px; background: #33213A"></div></div>
<span style="font-size: 13px; font-weight: 500">12:40 di 31:05</span>
</div>
<div style="min-width: 0; display: flex; flex-direction: column; padding: 4px 4px 4px 0">
<span style="font-weight: 600">YouTube</span>
<span style="margin-top: auto; font-size: 22px; font-weight: 800; line-height: 1.1; letter-spacing: -0.01em">Normalizzazione e forme normali</span>
<span style="margin-top: 12px; font-size: 13px; font-weight: 500">Poi: Indici e B-tree</span>
</div>
</article>

<article class="o-card" style="grid-column: 1 / 4; grid-row: 4 / 5; padding: 18px 22px; background: #EFECE5; color: #22251F; display: flex; align-items: center; gap: 22px">
<div style="flex: 0 0 auto"><div style="font-size: 44px; font-weight: 800; line-height: 0.9">12</div><div style="font-weight: 600">note</div></div>
<div style="flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-self: stretch">
<button type="button" style="text-align: left; padding: 12px 14px; border: 0; border-radius: 18px; background: #E2DED5; color: #22251F; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden"><span style="font-weight: 600; line-height: 1.2">Riassunto cap. 4</span><span style="font-size: 12px; color: #4D5047">2 ore fa</span></button>
<button type="button" style="text-align: left; padding: 12px 14px; border: 0; border-radius: 18px; background: #E2DED5; color: #22251F; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden"><span style="font-weight: 600; line-height: 1.2">Esercizi SQL</span><span style="font-size: 12px; color: #4D5047">ieri</span></button>
<button type="button" style="text-align: left; padding: 12px 14px; border: 0; border-radius: 18px; background: #E2DED5; color: #22251F; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden"><span style="font-weight: 600; line-height: 1.2">Idee per la tesi</span><span style="font-size: 12px; color: #4D5047">lunedì</span></button>
</div>
</article>

</div>
</main>
</div>
</body>
</html>
