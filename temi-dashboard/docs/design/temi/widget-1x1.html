.cap{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px}
.f-dots{background-image:radial-gradient(circle,#F4E9E4 2.2px,transparent 2.7px);background-size:6px 6px;background-position:center}
</style>
</head>

<div class="t" style="border-radius: 14px; border: 1px solid rgba(255,214,206,0.12); background: #0B0405; gap: 18px"><span aria-hidden="true" class="f-dots" style="width: 36px; height: 44px; border-radius: 10px"></span><span aria-hidden="true" class="f-dots" style="width: 36px; height: 44px; border-radius: 10px"></span></div>
