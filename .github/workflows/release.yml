# Compila l'app per macOS (un solo .dmg per Intel e Apple Silicon) e per
# Windows, e allega gli installer a una Release in bozza su GitHub.
# Si avvia con un tag "v*" (es. git tag v0.1.0 && git push --tags) oppure a
# mano da Actions > Release > Run workflow.
# Firma macOS con un certificato autofirmato (nessun account Apple Developer): chi scarica deve
# sbloccare l'app una volta, vedi README. Il certificato è sempre lo stesso, così il portachiavi
# riconosce ogni nuova versione come la stessa app e non chiede più il permesso per la sessione dei
# Gruppi (src-tauri/src/secure_store.rs). Non tornare alla firma ad-hoc e non cambiare certificato.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Nome (CN) del certificato autofirmato nei Secrets MACOS_CERTIFICATE*: non è un segreto.
      MACOS_SIGNING_IDENTITY: personalDashboard Self-Signed

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Aggiornamenti: la versione ha una sola fonte (package.json, letta da tauri.conf.json) e il tag deve
      # coincidere; la chiave pubblica va incollata prima di rilasciare (una release col segnaposto non potrebbe
      # più aggiornarsi) e la privata deve esserci, se no la build degli artefatti firmati fallisce.
      - name: Controlla versione e firma degli aggiornamenti
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          # tr: sul runner Windows il checkout ha i fine riga CRLF.
          cargo_version="$(tr -d '\r' < src-tauri/Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1)"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Il tag $REF_NAME non coincide con la versione di package.json ($version)."
            exit 1
          fi
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::src-tauri/Cargo.toml ha la versione $cargo_version, package.json $version: allineale."
            exit 1
          fi
          if grep -q 'INSERIRE_CHIAVE_PUBBLICA' src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json è ancora il segnaposto: incolla la chiave pubblica."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY assente: gli aggiornamenti non si possono firmare."
            exit 1
          fi

      # Avvisa (senza fermare la build e senza stampare i valori) se i Secrets dei Gruppi mancano o sono
      # sbagliati: l'app uscirebbe in solo locale ("Gruppi non configurati", src/core/cloud/config.ts).
      - name: Controlla la configurazione dei Gruppi
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          key="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')"
          if [ -z "$url" ]; then
            echo "::warning::Secret SUPABASE_URL vuoto o assente (Settings > Secrets and variables > Actions > Repository secrets): build senza Gruppi."
          elif [[ "$url" != https://* ]]; then
            echo "::warning::SUPABASE_URL deve iniziare con https:// (es. https://<ref>.supabase.co): build senza Gruppi."
          elif [[ "$url" != *.supabase.co && "$url" != *.supabase.co/ ]]; then
            echo "::warning::SUPABASE_URL non finisce in .supabase.co: controlla che sia l'URL del progetto."
          fi
          if [ -z "$key" ]; then
            echo "::warning::Secret SUPABASE_PUBLISHABLE_KEY vuoto o assente: build senza Gruppi."
          elif [[ "$key" == sb_secret_* ]]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY contiene una chiave secret: va messa la publishable (sb_publishable_...). Ruota la secret su Supabase."
            exit 1
          fi

      # macOS: portachiavi temporaneo con il certificato, reso fidato per la firma del codice (codesign non
      # usa un certificato autofirmato non fidato). Il .p12 decodificato si cancella subito.
      - name: Prepara il certificato per la firma macOS
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ] || [ -z "$MACOS_CERTIFICATE_PASSWORD" ]; then
            echo "::error::Secret MACOS_CERTIFICATE o MACOS_CERTIFICATE_PASSWORD assente: senza firma stabile il portachiavi del Mac chiederebbe il permesso a ogni versione."
            exit 1
          fi
          kc="$RUNNER_TEMP/firma.keychain-db"
          kc_pass="$(openssl rand -hex 24)"
          p12="$RUNNER_TEMP/firma.p12"
          cer="$RUNNER_TEMP/firma.cer"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$p12" -k "$kc" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$kc" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "$MACOS_SIGNING_IDENTITY" -p "$kc" > "$cer"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$cer"
          rm -f "$cer"
          if ! security find-identity -v -p codesigning "$kc" | grep -q "\"$MACOS_SIGNING_IDENTITY\""; then
            echo "::error::Il certificato \"$MACOS_SIGNING_IDENTITY\" non è utilizzabile per firmare: controlla nome (CN) e password del .p12."
            exit 1
          fi
          echo "FIRMA_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          # macOS: firma con il certificato autofirmato al posto del "-" (ad-hoc) di tauri.conf.json, che resta
          # per le build locali. Su Windows è vuota e non conta.
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && env.MACOS_SIGNING_IDENTITY || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Gruppi (opzionale): valori pubblici per progetto, letti dai Secrets del repo e mai
          # scritti nel repo. Se mancano, la build esce in solo locale ("Gruppi non configurati").
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Aggiornamenti: firma degli artefatti (bundle.createUpdaterArtifacts). La privata non è mai nel repo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'app-v__VERSION__' }}
          releaseName: "personalDashboard v__VERSION__"
          releaseBody: "Scarica il .dmg per macOS o l'installer .msi/.exe per Windows. Su macOS, al primo avvio, segui le istruzioni del README per sbloccare l'app."
          releaseDraft: true
          prerelease: false
          # latest.json per l'updater, allegato alla release: ogni job aggiunge le sue piattaforme. Il .dmg
          # universale finisce sia in darwin-aarch64 sia in darwin-x86_64; per Windows il plugin sceglie
          # windows-x86_64-msi o -nsis in base a come è stata installata l'app (windows-x86_64 = .msi).
          # Le note (notes) sono il releaseBody qui sopra: alla pubblicazione le riallinea release-notes.yml.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # La firma deve essere quella del certificato, non ad-hoc: con "cdhash" nel requisito il portachiavi
      # tornerebbe a chiedere il permesso. tauri-action ha già caricato i file nella bozza: se questo passo
      # fallisce, la bozza non va pubblicata.
      - name: Controlla la firma macOS
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          app="$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -n1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          requirement="$(codesign -d -r- "$app" 2>&1)"
          echo "$requirement"
          if grep -q 'cdhash' <<< "$requirement" || ! grep -q 'certificate' <<< "$requirement"; then
            echo "::error::L'app non è firmata con il certificato \"$MACOS_SIGNING_IDENTITY\": NON pubblicare questa bozza."
            exit 1
          fi

      - name: Rimuove il portachiavi temporaneo
        if: always() && matrix.platform == 'macos-latest'
        shell: bash
        run: |
          if [ -n "$FIRMA_KEYCHAIN" ]; then security delete-keychain "$FIRMA_KEYCHAIN" || true; fi

  # Controlla latest.json dopo entrambe le build: se manca una piattaforma, chi la usa non si aggiornerebbe.
  updater-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Controlla latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            version="$(gh api "repos/$GH_REPO/contents/package.json?ref=$GITHUB_SHA" --jq .content | base64 -d | jq -r .version)"
            tag="app-v$version"
          fi
          gh release download "$tag" --pattern latest.json --dir "$RUNNER_TEMP"
          file="$RUNNER_TEMP/latest.json"
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64; do
            if ! jq -e --arg p "$platform" '.platforms[$p] | (.url | length > 0) and (.signature | length > 0)' "$file" > /dev/null; then
              echo "::error::latest.json non ha la piattaforma $platform (o manca url/firma)."
              exit 1
            fi
          done
          if [ "$(jq -r '.platforms["darwin-aarch64"].url' "$file")" != "$(jq -r '.platforms["darwin-x86_64"].url' "$file")" ]; then
            echo "::error::darwin-aarch64 e darwin-x86_64 dovrebbero puntare entrambi al pacchetto universale."
            exit 1
          fi
          jq '{version, notes, platforms: (.platforms | map_values(.url))}' "$file"
