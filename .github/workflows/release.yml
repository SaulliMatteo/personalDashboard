# Compila l'app per macOS (un solo .dmg per Intel e Apple Silicon) e per
# Windows, e allega gli installer a una Release in bozza su GitHub.
# Si avvia con un tag "v*" (es. git tag v0.1.0 && git push --tags) oppure a
# mano da Actions > Release > Run workflow.
# Firma macOS ad-hoc (nessun account Apple Developer): chi scarica deve
# sbloccare l'app una volta, vedi README.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Avvisa (senza fermare la build e senza stampare i valori) se i Secrets dei Gruppi mancano o sono
      # sbagliati: l'app uscirebbe in solo locale ("Gruppi non configurati", src/core/cloud/config.ts).
      - name: Controlla la configurazione dei Gruppi
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          key="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')"
          if [ -z "$url" ]; then
            echo "::warning::Secret SUPABASE_URL vuoto o assente (Settings > Secrets and variables > Actions > Repository secrets): build senza Gruppi."
          elif [[ "$url" != https://* ]]; then
            echo "::warning::SUPABASE_URL deve iniziare con https:// (es. https://<ref>.supabase.co): build senza Gruppi."
          elif [[ "$url" != *.supabase.co && "$url" != *.supabase.co/ ]]; then
            echo "::warning::SUPABASE_URL non finisce in .supabase.co: controlla che sia l'URL del progetto."
          fi
          if [ -z "$key" ]; then
            echo "::warning::Secret SUPABASE_PUBLISHABLE_KEY vuoto o assente: build senza Gruppi."
          elif [[ "$key" == sb_secret_* ]]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY contiene una chiave secret: va messa la publishable (sb_publishable_...). Ruota la secret su Supabase."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Gruppi (opzionale): valori pubblici per progetto, letti dai Secrets del repo e mai
          # scritti nel repo. Se mancano, la build esce in solo locale ("Gruppi non configurati").
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'app-v__VERSION__' }}
          releaseName: "personalDashboard v__VERSION__"
          releaseBody: "Scarica il .dmg per macOS o l'installer .msi/.exe per Windows. Su macOS, al primo avvio, segui le istruzioni del README per sbloccare l'app."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
