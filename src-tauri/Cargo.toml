[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# Compila il server C di File Transfer (vedi build.rs).
cc = "1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Pinnata ESATTA (non "2" o "^2.4"): la 2.5.0 richiede tauri ^2.12, che
# confliggerebbe con la tauri = "2.11.3" pinnata sopra. Verificato contro
# il manifesto pubblicato su crates.io prima di aggiungerla.
tauri-plugin-notification = "=2.4.0"
# Anteprima immagini di File Transfer (invio al frontend come data URL).
base64 = "0.22"

# Companion: inattività di sistema e app in primo piano (src/companion.rs).
# 0.59 è già nel Cargo.lock come dipendenza di tauri su Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
