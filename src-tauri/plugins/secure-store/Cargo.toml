[package]
name = "tauri-plugin-secure-store"
version = "0.1.0"
description = "Archivio sicuro della sessione dei Gruppi su Android (Android Keystore)"
edition = "2021"
rust-version = "1.77.2"
publish = false
# Serve a Tauri per trovare e includere il progetto Android del plugin (android/).
links = "tauri-plugin-secure-store"

[dependencies]
# Stessa pinnatura esatta dell'app (vedi src-tauri/Cargo.toml).
tauri = { version = "=2.11.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
# Versione già nel Cargo.lock come dipendenza di tauri-build: nessun crate nuovo.
tauri-plugin = { version = "2.6.3", features = ["build"] }
