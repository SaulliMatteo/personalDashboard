[package]
name = "tauri-plugin-usage-stats"
version = "0.1.0"
description = "Tempo allo schermo su Android: legge dalla cronologia di uso delle app (UsageStatsManager), con il permesso Accesso ai dati di utilizzo"
edition = "2021"
rust-version = "1.77.2"
publish = false
# Serve a Tauri per trovare e includere il progetto Android del plugin (android/).
links = "tauri-plugin-usage-stats"

[dependencies]
# Stessa pinnatura esatta dell'app (vedi src-tauri/Cargo.toml).
tauri = { version = "=2.11.3", default-features = false }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
# Versione già nel Cargo.lock come dipendenza di tauri-build: nessun crate nuovo.
tauri-plugin = { version = "2.6.3", features = ["build"] }
